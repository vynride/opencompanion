name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check opencompanion tests
      - run: uvx ruff format --check opencompanion tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv venv
      # openwakeword has no wheel for Python 3.12+; the tests stub it
      - run: grep -v openwakeword requirements.txt | uv pip install -r /dev/stdin -r requirements-dev.txt
      - run: .venv/bin/pytest -q

  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck :core:test
