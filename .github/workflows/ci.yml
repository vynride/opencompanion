name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check opencompanion tests
      - run: ruff format --check opencompanion tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # openwakeword has no wheel for Python 3.12+; the tests stub it
      - run: grep -v openwakeword requirements.txt | pip install -r /dev/stdin -r requirements-dev.txt
      - run: pytest -q
